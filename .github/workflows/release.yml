name: Release
on:
  push:
    tags:
      - v*
jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
  version:
    name: Prepare version string
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Output version string
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
  package:
    needs: [build, version]
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
  release:
    needs: [package, version]
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package.*
          path: packages
          merge-multiple: true
      # Computed here rather than after the fact: the glob below attaches SHA256SUMS
      # together with the packages, and a published release accepts nothing more.
      # Written from inside packages/ so every line names the asset exactly as it is
      # published -- `sha256sum -c SHA256SUMS` then works next to the downloads.
      - name: Compute checksums
        env:
          SUMS: ${{ runner.temp }}/SHA256SUMS
        run: |
          cd packages
          sha256sum -- * > "$SUMS"
          mv "$SUMS" SHA256SUMS
      # Assets go in at creation time. A published release is immutable, so creating it
      # first and uploading afterwards fails with "Cannot upload assets to an immutable
      # release" — leaving a release behind with nothing attached to it.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$TAG" -t "$VERSION" --notes-from-tag packages/*
